<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockhill Tower · 1 Bed in 3D</title>
<meta name="description" content="Walk through the Rockhill Tower one-bedroom home in 3D, built from Rockhill's own floor plan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23131518'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' text-anchor='middle' fill='%23D2AA4B'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, premium sales-gallery model on a dark plinth.
   IDEA: Rockhill's own 1-bed plan lifted into a 3D model you can turn and walk through.
   PICTURE: the 3D apartment fills the screen; room labels float over it.
   COLOUR & TYPE: Rockhill night #131518, LED gold #D2AA4B; Josefin Sans light + Montserrat.
   LAYOUT: model full screen, title card top-left, room card right, controls along the bottom. */
:root{color-scheme:dark;--gold:#D2AA4B;--gold2:#ecc96f;--ink:#f3f0ea;--mute:#c9cdd6;--line:rgba(255,255,255,.13);--glass:rgba(18,21,28,.66)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,#2b2d33,#131518 70%);color:var(--ink);font:15px/1.5 Montserrat,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
h1,h2{font-family:'Josefin Sans',sans-serif;font-weight:300;margin:0;line-height:1.05}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px}
.title{position:fixed;top:18px;left:max(2.5vw,14px);padding:16px 20px;max-width:min(380px,calc(100vw - 28px));z-index:3}
.brand{font:300 13px/1 'Josefin Sans',sans-serif;letter-spacing:.32em;color:var(--mute)}
.title h1{font-size:clamp(30px,3.4vw,44px);margin-top:10px}
.title p{margin:8px 0 0;color:var(--mute);font-size:14px}
.title .area{color:var(--gold2);font-weight:500}
.room{position:fixed;top:18px;right:max(2.5vw,14px);width:min(300px,40vw);padding:16px 18px;z-index:3;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;pointer-events:none}
.room.on{opacity:1;transform:none;pointer-events:auto}
.room .k{color:var(--gold);font-size:13px;font-weight:500;margin:0}
.room h2{font-size:30px;margin-top:4px}
.room .sz{margin:4px 0 0;font-size:14px;color:var(--mute)}
.room .d{margin:8px 0 0;font-size:14px;color:#dfe2e8}
.room img{width:100%;height:140px;object-fit:cover;object-position:50% 35%;border-radius:8px;margin-top:12px;display:none}
.room.kit img{display:block}
.bar{position:fixed;left:50%;bottom:max(2vh,14px);transform:translateX(-50%);display:flex;gap:6px;padding:8px;z-index:3;max-width:calc(100vw - 24px);overflow-x:auto}
.bar button{flex:none;min-height:44px;padding:0 15px;border-radius:9px;border:1px solid transparent;background:none;color:#fff;font-size:14px;cursor:pointer;transition:background-color .2s,border-color .2s,transform .3s cubic-bezier(.2,.9,.25,1.25)}
.bar button:hover{background:rgba(255,255,255,.08)}
.bar button:active{transform:scale(.95)}
.bar button[aria-pressed=true]{border-color:var(--gold);color:var(--gold2)}
.wa{position:fixed;right:max(2.5vw,14px);bottom:max(2vh,14px);z-index:3;min-height:46px;display:flex;align-items:center;padding:0 18px;border-radius:10px;background:var(--gold);color:#131518;font-weight:600;font-size:14px;text-decoration:none}
.wa:hover{background:var(--gold2)}
.labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;white-space:nowrap;padding:7px 12px;border-radius:20px;background:rgba(18,21,28,.78);border:1px solid rgba(210,170,75,.55);color:#fff;font-size:13px;line-height:1.2;text-align:center;transition:opacity .3s,background-color .2s,border-color .2s;backdrop-filter:blur(8px)}
.lab b{display:block;font-weight:500}
.lab span{color:var(--gold2);font-size:12px}
.lab:hover,.lab.act{background:var(--gold);color:#131518;border-color:var(--gold)}
.lab:hover span,.lab.act span{color:#131518}
.lab.hide{opacity:0;pointer-events:none}
.hint{position:fixed;left:50%;top:22px;transform:translateX(-50%);font-size:13px;color:var(--mute);z-index:1;white-space:nowrap;transition:opacity .6s}
.note{position:fixed;left:max(2.5vw,14px);bottom:max(2vh,14px);font-size:12.5px;color:#9a9da6;max-width:260px;z-index:1}
@media(max-width:820px){
 .room{top:auto;bottom:150px;right:12px;left:12px;width:auto}
 .room img{height:110px}
 .hint,.note{display:none}
 .wa{bottom:auto;top:18px;right:12px;min-height:40px;padding:0 12px}
 .title{max-width:calc(100vw - 150px)}
 .bar{left:12px;transform:none;bottom:72px}
 .lab{font-size:12px;padding:6px 10px}
}
@media(prefers-reduced-motion:reduce){.room,.lab,.hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D model of the Rockhill Tower one-bedroom home. Drag to turn, scroll to zoom, or use the room buttons."></canvas>
<div class="labels" id="labels"></div>

<div class="title glass">
  <div class="brand">ROCKHILL TOWER</div>
  <h1>1 Bed residence</h1>
  <p><span class="area">689 sq ft</span> · family hall, master bedroom, kitchen, bathroom and two balconies</p>
</div>

<div class="room glass" id="room" aria-live="polite">
  <p class="k" id="rk">Room</p><h2 id="rh"></h2><p class="sz" id="rs"></p><p class="d" id="rd"></p>
  <img id="rimg" alt="Kitchen finishes: Scavolini cabinetry, Miele appliances, Grohe fittings, Daikin climate, KNX smart home">
</div>

<div class="hint" id="hint">Drag to turn · scroll to zoom · click a room</div>
<div class="bar glass" id="bar" role="toolbar" aria-label="Views"></div>

  const w=(x1-x0)*P.mpp,d=(y1-y0)*P.mpp,h=hOf[k];
  const g=new THREE.Group();g.position.set(((x0+x1)/2-P.w/2)*P.mpp,0,((y0+y1)/2-P.h/2)*P.mpp);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats[k]);m.position.y=h/2;m.castShadow=k!=='g';m.receiveShadow=true;g.add(m);
  if(k!=='g'){const c=new THREE.Mesh(new THREE.BoxGeometry(w+.002,.025,d+.002),cap);c.position.y=h;g.add(c)}
  g.userData.h=h;scene.add(g);walls.push(g);
}
let wallF=0;
function setWalls(f){wallF=f;for(const g of walls){g.scale.y=Math.max(.001,f)}}
setWalls(0);
const toW=(x,y)=>new THREE.Vector3((x-P.w/2)*P.mpp,0,(y-P.h/2)*P.mpp);

/* camera rig */
const rig={t:new THREE.Vector3(),yaw:0,pitch:1.5707,dist:10};
let anim=null,wallAnim=null,userYaw=0,userPitch=0,userZoom=1,lastInput=performance.now(),auto=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fit(){return Math.max(D,W/camera.aspect)/2/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*1.08}
const VIEWS={top:()=>({t:new THREE.Vector3(),yaw:0,pitch:1.5707,dist:fit()}),
  over:()=>({t:new THREE.Vector3(0,.3,0),yaw:.55,pitch:.88,dist:fit()*1.12}),
  room:r=>({t:toW(...r.view).setY(.4),yaw:r.yaw+.25,pitch:1.08,dist:Math.max(12,Math.max(W,D)*1.25)*(camera.aspect<1?1.35:1)})};
function moveTo(v,dur){return new Promise(res=>{
  rig.yaw+=userYaw;rig.pitch=Math.max(.45,Math.min(1.5707,rig.pitch+userPitch));rig.dist*=userZoom;userYaw=userPitch=0;userZoom=1;
  const to={t:v.t.clone(),yaw:rig.yaw+Math.atan2(Math.sin(v.yaw-rig.yaw),Math.cos(v.yaw-rig.yaw)),pitch:v.pitch,dist:v.dist};
  anim={f:{t:rig.t.clone(),yaw:rig.yaw,pitch:rig.pitch,dist:rig.dist},to,t0:performance.now(),dur:reduce?1:dur,res}})}
function wallsTo(b,dur){return new Promise(res=>{wallAnim={a:wallF,b,t0:performance.now(),dur:reduce?1:dur,res}})}
function place(){
  const yaw=rig.yaw+userYaw,pitch=Math.max(.45,Math.min(1.5707,rig.pitch+userPitch)),d=rig.dist*userZoom,cp=Math.cos(pitch),sp=Math.sin(pitch);
  camera.position.set(rig.t.x+d*cp*Math.sin(yaw),rig.t.y+d*sp,rig.t.z+d*cp*Math.cos(yaw));
  camera.up.set(0,1,0);if(pitch>1.56)camera.up.set(-Math.sin(yaw),0,-Math.cos(yaw));camera.lookAt(rig.t);
}

/* labels */
const labels=$('labels');
labels.innerHTML=ROOMS.map((r,i)=>`<button class="lab" data-i="${i}" aria-label="${r.n}, ${r.sz} square feet"><b>${r.n}</b><span>${r.sz} sq ft</span></button>`).join('');
const labEls=[...labels.children];
labels.addEventListener('click',e=>{const b=e.target.closest('.lab');if(b){stopAuto();goRoom(+b.dataset.i)}});
const v3=new THREE.Vector3();
function placeLabels(){
  const show=wallF>.9&&!anim;
  labEls.forEach((el,i)=>{const r=ROOMS[i];v3.copy(toW(r.x,r.y)).setY(WH+.35).project(camera);
    el.style.transform=`translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`;
    el.classList.toggle('hide',!show||v3.z>1)});
}

/* room card + bar */
const card=$('room');let curRoom=-1;
function showRoom(i){
  curRoom=i;labEls.forEach((l,j)=>l.classList.toggle('act',j===i));
  if(i<0){card.classList.remove('on');return}
  const r=ROOMS[i];$('rk').textContent=r.k;$('rh').textContent=r.n;$('rs').textContent=r.sz+' sq ft';$('rd').textContent=r.d;
  card.classList.toggle('kit',!!r.kit);card.classList.add('on');
}
async function goRoom(i){showRoom(i);setPressed(null);if(wallF<.5)wallsTo(1,900);await moveTo(VIEWS.room(ROOMS[i]),1600)}
const BTNS=[['over','Overview'],['top','Top view'],['walls','Walls down'],['auto','Auto tour']];
const bar=$('bar');bar.innerHTML=BTNS.map(([k,n])=>`<button data-k="${k}" aria-pressed="false">${n}</button>`).join('');
function setPressed(k){bar.querySelectorAll('[data-k]').forEach(b=>{if(b.dataset.k!=='walls')b.setAttribute('aria-pressed',b.dataset.k===k)})}
bar.addEventListener('click',async e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='auto'){auto?stopAuto():startAuto();return}
  stopAuto();
  if(k==='over'){showRoom(-1);setPressed('over');if(wallF<.5)wallsTo(1,900);moveTo(VIEWS.over(),1600)}
  else if(k==='top'){showRoom(-1);setPressed('top');moveTo(VIEWS.top(),1500)}
  else if(k==='walls'){const down=wallF>.5;wallsTo(down?0:1,1000);b.textContent=down?'Walls up':'Walls down';b.setAttribute('aria-pressed',down)}
});
function startAuto(){
  setPressed('auto');let i=0;
  const step=async()=>{if(!auto)return;await goRoom(i);bar.querySelector('[data-k=auto]').setAttribute('aria-pressed','true');i=(i+1)%ROOMS.length;auto=setTimeout(step,2600)};
  auto=setTimeout(step,0);
}
function stopAuto(){if(auto){clearTimeout(auto);auto=null}bar.querySelector('[data-k=auto]').setAttribute('aria-pressed','false')}

/* input */
const ptr=new Map();let pd=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('drag');stopAuto();
  if(ptr.size===2){const [a,b]=[...ptr.values()];pd={d:Math.hypot(a.x-b.x,a.y-b.y),z:userZoom}}});
canvas.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||anim)return;const p=ptr.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;lastInput=performance.now();$('hint').style.opacity=0;
  if(ptr.size===2&&pd){const [a,b]=[...ptr.values()];userZoom=Math.max(.45,Math.min(1.8,pd.z*pd.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))))}
  else{userYaw-=dx*.006;userPitch=Math.max(.45-rig.pitch,Math.min(1.5707-rig.pitch,userPitch+dy*.004))}});
const up=e=>{ptr.delete(e.pointerId);if(!ptr.size)canvas.classList.remove('drag');if(ptr.size<2)pd=null};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();if(anim)return;stopAuto();lastInput=performance.now();userZoom=Math.max(.45,Math.min(1.8,userZoom*Math.exp(e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')userYaw+=.12;if(e.key==='ArrowRight')userYaw-=.12});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<820?40:30;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
Object.assign(rig,VIEWS.top());place();
function loop(now){
  if(anim){const k=Math.min(1,(now-anim.t0)/anim.dur),e=ease(k);rig.t.lerpVectors(anim.f.t,anim.to.t,e);for(const p of ['yaw','pitch','dist'])rig[p]=anim.f[p]+(anim.to[p]-anim.f[p])*e;if(k>=1){const r=anim.res;anim=null;r()}}
  if(wallAnim){const k=Math.min(1,(now-wallAnim.t0)/wallAnim.dur);setWalls(wallAnim.a+(wallAnim.b-wallAnim.a)*ease(k));if(k>=1){const r=wallAnim.res;wallAnim=null;r()}}
  if(!anim&&!auto&&!reduce&&curRoom<0&&now-lastInput>5000&&rig.pitch<1.5)userYaw+=.0012;
  place();placeLabels();renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* opening: the flat plan, walls rise, camera settles on the overview */
(async()=>{await new Promise(r=>setTimeout(r,reduce?0:700));wallsTo(1,1500);await moveTo(VIEWS.over(),2400);setPressed('over');lastInput=performance.now()})();
setTimeout(()=>{$('hint').style.opacity=0},9000);
}
</script>
</body>
</html>
